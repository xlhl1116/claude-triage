name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python benchmark/eval_rules.py
      - run: python benchmark/run_bench.py --check-references
      - run: python skills/triage/scripts/gen_agents.py --check
      - name: Validate plugin manifests
        run: |
          python -c "import json; [json.load(open(p)) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', 'skills/triage/rules.json', 'skills/triage/providers.json', 'settings.json', 'hooks/hooks.json')]"
